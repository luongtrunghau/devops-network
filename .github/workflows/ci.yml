name: CI/CD with Advanced UI Testing

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Kiểm tra cú pháp cơ bản
      - name: Run Syntax Check
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./check_code.ps1

      # 2. Cài đặt Node.js và chạy Playwright Test đa thiết bị
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run UI Tests
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
          node test_app.mjs

      # 3. Báo động Telegram khẩn cấp nếu bài test giao diện/Mobile bị lỗi
      - name: Notify Telegram on UI Test Failure
        if: failure()
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $msg = "[CI ERROR] Robot phát hiện lỗi giao diện hoặc lỗi di động (Mobile Responsive)! Đã chặn Deploy."
          $url = "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$env:TELEGRAM_CHAT_ID&text=$([Uri]::EscapeDataString($msg))"
          Invoke-RestMethod -Uri $url -Method Get

      # 4. Chỉ Deploy lên GitHub Pages nếu vượt qua toàn bộ bài test khó nhằn
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4