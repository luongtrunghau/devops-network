<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCheck Pro | Phiên bản Lỗi Giao Diện</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1e1b4b;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .broken-box {
            background: #312e81;
            padding: 30px;
            border-radius: 12px;
            border: 2px dashed #f43f5e;
            width: 500px;
            text-align: center;
        }
        input {
            padding: 10px;
            width: 60%;
            border-radius: 6px;
            border: none;
        }
        button {
            padding: 10px 20px;
            background: #f43f5e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* BẪY 1: Lỗi giao diện Mobile - Ẩn nút bấm khi màn hình nhỏ */
        @media (max-width: 600px) {
            #checkBtn {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="broken-box">
        <h2>⚠️ Hệ thống đang gặp sự cố giao diện</h2>
        <p>Trang web này được tạo ra để test robot Playwright bắt lỗi.</p>
        
        <div style="margin-top: 20px;">
            <input type="text" id="domainInput" placeholder="Nhập tên miền...">
            <button id="checkBtn" onclick="brokenFunction()">Kiểm tra</button>
        </div>

        <!-- BẪY 3: Thiếu class 'active' khi bấm nên robot đợi mãi không thấy kết quả -->
        <div id="resultBox" style="display: none;">Kết quả</div>
    </div>

    <script>
        // BẪY 2: Cố tình bắn lỗi ngầm ra Console ngay khi mở trang
        console.error("CRITICAL ERROR: Không thể kết nối tới cơ sở dữ liệu cấu hình!");

        function brokenFunction() {
            alert("Nút này đã bị hỏng chức năng!");
        }
    </script>
</body>
</html>
