<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCheck Pro | Công cụ Kiểm tra Mạng & DevOps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #090d16, #131c31);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .dashboard {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 35px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 1.6rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }
        button {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .result-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 20px;
            display: none;
        }
        .result-card.active { display: block; }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .metric {
            background: rgba(30, 41, 59, 0.6);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-label { color: #94a3b8; font-size: 0.8rem; margin-bottom: 5px; }
        .metric-value { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
        .online { color: #4ade80 !important; }
        .offline { color: #f87171 !important; }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
        @media (max-width: 600px) {
            .search-box { flex-direction: column; }
            .metric-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🌐 NetCheck Pro</h1>
            <span class="status-badge">● CI/CD Verified</span>
        </div>

        <p style="color: #94a3b8; margin-bottom: 18px; font-size: 0.95rem;">
            Nhập tên miền website để kiểm tra trạng thái kết nối, tốc độ phản hồi (Latency) và phân giải DNS.
        </p>

        <div class="search-box">
            <input type="text" id="domainInput" placeholder="Ví dụ: google.com, github.com..." value="github.com">
            <button id="checkBtn" onclick="checkWebsite()">Kiểm tra ngay</button>
        </div>

        <div id="resultBox" class="result-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong id="targetDomain" style="font-size: 1.1rem;">github.com</strong>
                <span id="statusText" class="online">● Đang hoạt động (Online)</span>
            </div>
            <div class="metric-grid">
                <div class="metric">
                    <div class="metric-label">Phản hồi (Latency)</div>
                    <div class="metric-value" id="latencyVal">-- ms</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Địa chỉ IP (DNS)</div>
                    <div class="metric-value" id="ipVal">--.--.--.--</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Giao thức</div>
                    <div class="metric-value">HTTPS / DNS</div>
                </div>
            </div>
        </div>

        <div class="footer">
            DevOps Network Project &bull; Vận hành bởi <strong>Lương Trung Hậu</strong>
        </div>
    </div>

    <script>
        async function checkWebsite() {
            const input = document.getElementById('domainInput').value.trim().replace(/^https?:\/\//, '').split('/')[0];
            if (!input) return alert('Vui lòng nhập tên miền!');

            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');
            const latencyVal = document.getElementById('latencyVal');
            const ipVal = document.getElementById('ipVal');
            
            document.getElementById('targetDomain').innerText = input;
            resultBox.classList.add('active');
            statusText.innerText = '⏳ Đang quét...';
            statusText.className = '';
            latencyVal.innerText = '...';
            ipVal.innerText = '...';

            const startTime = performance.now();
            try {
                const response = await fetch(`https://dns.google/resolve?name=${input}&type=A`);
                const data = await response.json();
                const endTime = performance.now();
                const ping = Math.round(endTime - startTime);

                if (data.Status === 0 && data.Answer) {
                    const ipRecord = data.Answer.find(ans => ans.type === 1);
                    statusText.innerText = '● Hoạt động tốt (Online)';
                    statusText.className = 'online';
                    latencyVal.innerText = `${ping} ms`;
                    ipVal.innerText = ipRecord ? ipRecord.data : 'Cloud/CDN';
                } else {
                    throw new Error('Không tìm thấy bản ghi DNS');
                }
            } catch (error) {
                statusText.innerText = '✖ Không thể truy cập (Offline)';
                statusText.className = 'offline';
                latencyVal.innerText = 'Timeout';
                ipVal.innerText = 'N/A';
            }
        }
    </script>
</body>
</html>
